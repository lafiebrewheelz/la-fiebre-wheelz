
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Fiebre Wheelz Racing League</title>
  <style>
    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      background: #c8102e;
      padding: 30px 15px;
    }
    h1 { margin: 0; }
    main { padding: 35px 20px; }
    .card {
      background: #202020;
      border: 1px solid #444;
      border-radius: 14px;
      padding: 24px;
      margin: 20px auto;
      max-width: 450px;
    }
  </style>
</head>
<body>
  <header>
    <h1>LA FIEBRE WHEELZ</h1>
    <p>RACING LEAGUE</p>
  </header>
  <main>
    <h2>¡Bienvenidos a la pista!</h2>
    <div class="card">
      <h2>🏎️ Carreras</h2>
      <p>Compite, sigue los duelos y descubre al ganador.</p>
    </div>
    <div class="card">
      <h2>🏆 Campeonato</h2>
      <p>Predice resultados y acumula puntos.</p>
    </div>
    <div class="card">
      <h2>🚗 Garaje</h2>
      <p>Conoce los carros de nuestra colección.</p>
    </div>
  </main>
</body>
</html>
